[project]
name = "quantagent"
version = "0.1.0"
description = "Governed financial analysis agent: deterministic quant core, evidence-linked answers, hybrid verification."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "redis>=5.1",
    "httpx>=0.27",
    "tenacity>=9.0",
    "anthropic>=0.39",
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "cvxpy>=1.5",
    "yfinance>=0.2",
    "sec-edgar-downloader>=5.0",
    "structlog>=24.4",
    "opentelemetry-sdk>=1.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "mcp>=2.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.115",
    "vcrpy>=6.0",
    "respx>=0.21",
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "pandas-stubs>=2.2",
    "scipy-stubs>=1.14",
    "aiosqlite>=0.20",
    "types-pyyaml>=6.0.12.20260815",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantagent"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends(...)/Header(...)/Query(...) in a parameter default is
# the framework's own documented pattern, not the mutable-default-argument
# footgun B008 exists to catch -- the standard ruff+FastAPI exemption.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "quantagent.contracts.*",
    "quantagent.quant.*",
    "quantagent.data.*",
    "quantagent.tools.*",
    "quantagent.verify.*",
    "quantagent.api.*",
    "quantagent.obs.*",
    "quantagent.config",
    "quantagent.agent.*",
    "quantagent.llm.*",
]
strict = true

[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "cvxpy.*",
    "sec_edgar_downloader.*",
    "sklearn.*",
    "statsmodels.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/quantagent --cov-report=term-missing"

[tool.coverage.run]
source = ["src/quantagent"]
